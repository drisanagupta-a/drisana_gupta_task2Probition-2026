<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Arcade Mania - Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
<div class="gamePage">
<header class="gameHUD">
    <div>ENERGY: <b id="energy">0</b></div>
    <div>ARCADE MANIA</div>
    <div>LIVES: <b id="lives">3</b></div>
    <button id="exitGame">EXIT</button>
</header>
<main class="gameContainer">
    <div id="gameMessage">READY PLAYER</div>
    <canvas id="gameCanvas" width="1000" height="500"></canvas>
    <div class="controls">
        <span>← → MOVE</span>
        <span>SPACE JUMP</span>
    </div>
</main>
</div>
<script src="game.js"></script>
</body>
</html>
