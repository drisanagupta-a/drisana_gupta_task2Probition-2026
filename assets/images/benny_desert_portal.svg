<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground shadow -->
  <ellipse cx="100" cy="238" rx="58" ry="10" fill="#2b2117" opacity="0.18"/>

  <!-- left sandstone pillar -->
  <rect x="34" y="96" width="26" height="128" rx="8" fill="#e3b673" stroke="#2b2117" stroke-width="6"/>
  <g stroke="#c68f47" stroke-width="4">
    <line x1="34" y1="128" x2="60" y2="128"/>
    <line x1="34" y1="160" x2="60" y2="160"/>
    <line x1="34" y1="192" x2="60" y2="192"/>
  </g>
  <!-- simple carved glyph marks -->
  <path d="M40 138 l6 8 m0 -8 l-6 8" stroke="#3a2a18" stroke-width="3" stroke-linecap="round"/>
  <circle cx="47" cy="172" r="3.5" fill="none" stroke="#3a2a18" stroke-width="3"/>

  <!-- right sandstone pillar -->
  <rect x="140" y="96" width="26" height="128" rx="8" fill="#e3b673" stroke="#2b2117" stroke-width="6"/>
  <g stroke="#c68f47" stroke-width="4">
    <line x1="140" y1="128" x2="166" y2="128"/>
    <line x1="140" y1="160" x2="166" y2="160"/>
    <line x1="140" y1="192" x2="166" y2="192"/>
  </g>
  <path d="M146 138 l6 8 m0 -8 l-6 8" stroke="#3a2a18" stroke-width="3" stroke-linecap="round"/>
  <circle cx="153" cy="172" r="3.5" fill="none" stroke="#3a2a18" stroke-width="3"/>

  <!-- arch top -->
  <path d="M30 108 Q100 24 170 108 L170 122 Q100 46 30 122 Z"
        fill="#e3b673" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- doorway -->
  <path d="M58 214 L58 122 Q100 76 142 122 L142 214 Z"
        fill="#7a3b1e" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- flat sun swirl inside doorway -->
  <circle cx="100" cy="160" r="20" fill="none" stroke="#f2a71b" stroke-width="6"/>
  <g stroke="#ffd23f" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="132" x2="100" y2="122"/>
    <line x1="122" y1="160" x2="132" y2="160"/>
    <line x1="115" y1="145" x2="122" y2="138"/>
    <line x1="85" y1="145" x2="78" y2="138"/>
  </g>

  <!-- small flat sparkle for goal readability -->
  <path d="M124 196 l4 8 l8 2 l-8 3 l-4 8 l-3 -8 l-8 -3 l8 -2 Z" fill="#ffe58a"/>

  <!-- sun disc topper -->
  <circle cx="100" cy="26" r="14" fill="#ffd23f" stroke="#2b2117" stroke-width="6"/>
  <g stroke="#2b2117" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="8" x2="100" y2="2"/>
    <line x1="118" y1="26" x2="126" y2="26"/>
    <line x1="82" y1="26" x2="74" y2="26"/>
    <line x1="113" y1="13" x2="118" y2="8"/>
    <line x1="87" y1="13" x2="82" y2="8"/>
  </g>
</svg>
