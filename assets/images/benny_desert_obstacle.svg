<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- sand mound base -->
  <path d="M10 130 Q30 108 60 118 Q100 100 140 118 Q180 106 210 128 L210 132 L10 132 Z"
        fill="#e3b673" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- left arm (drawn first, sits behind trunk) -->
  <path d="M80 100 L80 74 Q80 58 64 58 Q50 58 50 72 Q50 84 62 86 Q70 88 80 84 Z"
        fill="#4f9b5e" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>
  <!-- right arm -->
  <path d="M136 88 L136 62 Q136 46 152 46 Q166 46 166 60 Q166 72 154 74 Q146 76 136 72 Z"
        fill="#4f9b5e" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- main trunk (drawn last, covers arm joints for a clean silhouette) -->
  <path d="M92 130 L92 46 Q92 30 108 30 Q124 30 124 46 L124 130 Z"
        fill="#4f9b5e" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- flat shading strip down the middle (no gradient) -->
  <path d="M112 40 L112 128 L118 128 L118 40 Z" fill="#3c7d49" opacity="0.6"/>
  <!-- ribs -->
  <g stroke="#3c7d49" stroke-width="3" opacity="0.7">
    <line x1="98" y1="46" x2="98" y2="128"/>
    <line x1="80" y1="66" x2="80" y2="98"/>
    <line x1="136" y1="54" x2="136" y2="86"/>
  </g>

  <!-- thorns: pale, clearly visible against the green -->
  <g stroke="#fdf3d8" stroke-width="4.5" stroke-linecap="round">
    <line x1="96" y1="58" x2="88" y2="53"/>
    <line x1="96" y1="78" x2="88" y2="73"/>
    <line x1="96" y1="98" x2="88" y2="93"/>
    <line x1="96" y1="118" x2="88" y2="113"/>
    <line x1="120" y1="58" x2="128" y2="53"/>
    <line x1="120" y1="78" x2="128" y2="73"/>
    <line x1="120" y1="98" x2="128" y2="93"/>
    <line x1="120" y1="118" x2="128" y2="113"/>
    <line x1="66" y1="66" x2="56" y2="62"/>
    <line x1="66" y1="82" x2="56" y2="84"/>
    <line x1="150" y1="54" x2="160" y2="50"/>
    <line x1="150" y1="70" x2="160" y2="72"/>
  </g>

  <!-- small rocks flanking the cactus -->
  <g fill="#8a8f85" stroke="#2b2117" stroke-width="5" stroke-linejoin="round">
    <path d="M20 130 Q16 114 32 112 Q46 114 42 130 Z"/>
    <path d="M180 130 Q178 118 190 116 Q202 118 200 130 Z"/>
  </g>
  <path d="M24 122 Q30 116 38 118" fill="none" stroke="#6e7266" stroke-width="3"/>
</svg>
