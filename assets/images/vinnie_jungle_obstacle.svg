<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- fallen log base -->
  <rect x="14" y="100" width="192" height="30" rx="10" fill="#7a5230" stroke="#2b2117" stroke-width="6"/>
  <ellipse cx="26" cy="115" rx="12" ry="15" fill="#8a6238" stroke="#2b2117" stroke-width="6"/>
  <ellipse cx="26" cy="115" rx="6" ry="8" fill="#6b4423"/>
  <g stroke="#6b4423" stroke-width="3">
    <line x1="60" y1="104" x2="60" y2="126"/>
    <line x1="100" y1="104" x2="100" y2="126"/>
    <line x1="140" y1="104" x2="140" y2="126"/>
    <line x1="180" y1="104" x2="180" y2="126"/>
  </g>

  <!-- thorny vine coiling over the log -->
  <path d="M20 96 Q50 60 90 78 Q130 96 170 58 Q190 40 204 56"
        fill="none" stroke="#3f7d3f" stroke-width="9" stroke-linecap="round"/>

  <!-- thorns along the vine -->
  <g fill="#5b3a22" stroke="#2b2117" stroke-width="4" stroke-linejoin="round">
    <path d="M36 72 L48 42 L54 76 Z"/>
    <path d="M70 66 L82 32 L88 74 Z"/>
    <path d="M104 82 L116 48 L122 88 Z"/>
    <path d="M138 74 L150 38 L156 82 Z"/>
    <path d="M170 56 L182 22 L188 64 Z"/>
  </g>

  <!-- a few small leaves for jungle flavor -->
  <g fill="#2ecc71" stroke="#2b2117" stroke-width="3.5" stroke-linejoin="round">
    <path d="M60 68 q-10 -4 -6 -14 q12 0 6 14Z"/>
    <path d="M124 74 q10 -4 6 -14 q-12 0 -6 14Z"/>
    <path d="M158 52 q-10 -4 -6 -14 q12 0 6 14Z"/>
  </g>
</svg>
