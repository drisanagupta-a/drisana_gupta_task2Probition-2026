<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground shadow -->
  <ellipse cx="100" cy="238" rx="58" ry="10" fill="#2b2117" opacity="0.18"/>

  <!-- left stone pillar -->
  <rect x="34" y="96" width="26" height="128" rx="8" fill="#9a9d8c" stroke="#2b2117" stroke-width="6"/>
  <g stroke="#7c7e6d" stroke-width="4">
    <line x1="34" y1="128" x2="60" y2="128"/>
    <line x1="34" y1="160" x2="60" y2="160"/>
    <line x1="34" y1="192" x2="60" y2="192"/>
  </g>
  <!-- right stone pillar -->
  <rect x="140" y="96" width="26" height="128" rx="8" fill="#9a9d8c" stroke="#2b2117" stroke-width="6"/>
  <g stroke="#7c7e6d" stroke-width="4">
    <line x1="140" y1="128" x2="166" y2="128"/>
    <line x1="140" y1="160" x2="166" y2="160"/>
    <line x1="140" y1="192" x2="166" y2="192"/>
  </g>

  <!-- arch top -->
  <path d="M30 108 Q100 24 170 108 L170 122 Q100 46 30 122 Z"
        fill="#9a9d8c" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- doorway -->
  <path d="M58 214 L58 122 Q100 76 142 122 L142 214 Z"
        fill="#16301f" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>

  <!-- simple flat leafy swirl inside doorway -->
  <path d="M78 200 Q100 170 90 148 Q84 132 104 126" fill="none" stroke="#5fd38a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="104" cy="126" r="6" fill="#a9e6bf"/>

  <!-- vines draped from the arch -->
  <g fill="none" stroke="#3f7d3f" stroke-width="5" stroke-linecap="round">
    <path d="M46 108 Q40 130 48 150 Q54 164 44 176"/>
    <path d="M154 108 Q160 132 150 152 Q146 166 156 180"/>
    <path d="M84 40 Q90 58 80 70"/>
    <path d="M118 40 Q112 58 122 70"/>
  </g>
  <!-- small leaves along vines (flat, simple, consistent outline) -->
  <g fill="#2ecc71" stroke="#2b2117" stroke-width="3.5" stroke-linejoin="round">
    <path d="M48 150 q10 -6 14 4 q-10 6 -14 -4Z"/>
    <path d="M44 176 q-10 -4 -8 8 q10 2 8 -8Z"/>
    <path d="M150 152 q-10 -6 -14 4 q10 6 14 -4Z"/>
    <path d="M156 180 q10 -4 8 8 q-10 2 -8 -8Z"/>
    <path d="M80 70 q-8 -6 -2 -14 q10 4 2 14Z"/>
    <path d="M122 70 q8 -6 2 -14 q-10 4 -2 14Z"/>
  </g>

  <!-- leafy canopy tuft on top instead of a star -->
  <g stroke="#2b2117" stroke-width="4" stroke-linejoin="round">
    <path d="M100 8 q-20 4 -20 22 q12 8 20 -2 q8 10 20 2 q0 -18 -20 -22Z" fill="#2ecc71"/>
    <path d="M100 8 q-10 6 -10 18" fill="none" stroke="#1f7a45" stroke-width="3"/>
    <path d="M100 8 q10 6 10 18" fill="none" stroke="#1f7a45" stroke-width="3"/>
  </g>
</svg>
