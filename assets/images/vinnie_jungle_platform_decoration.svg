<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- big tropical leaf -->
  <path d="M40 100 Q20 70 34 40 Q50 16 78 14 Q70 44 58 70 Q50 88 40 100 Z"
        fill="#2ecc71" stroke="#2b2117" stroke-width="6" stroke-linejoin="round"/>
  <!-- leaf veins (flat lines, no gradient) -->
  <g stroke="#1f7a45" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M78 14 Q58 46 42 96"/>
    <path d="M66 26 Q56 44 48 62"/>
    <path d="M60 42 Q52 56 46 72"/>
  </g>
  <!-- small leaf slits like a monstera, subtle -->
  <path d="M52 30 Q56 36 52 42" fill="none" stroke="#1f7a45" stroke-width="3"/>
  <path d="M46 52 Q50 58 46 64" fill="none" stroke="#1f7a45" stroke-width="3"/>

  <!-- second smaller leaf -->
  <path d="M108 100 Q96 82 104 62 Q112 46 130 44 Q126 64 118 82 Q112 92 108 100 Z"
        fill="#22a35c" stroke="#2b2117" stroke-width="5" stroke-linejoin="round"/>
  <path d="M130 44 Q116 66 110 96" fill="none" stroke="#186339" stroke-width="3" stroke-linecap="round"/>

  <!-- curling vine with tiny round leaves -->
  <path d="M150 100 Q158 76 148 60 Q140 46 152 32"
        fill="none" stroke="#3f7d3f" stroke-width="6" stroke-linecap="round"/>
  <g fill="#2ecc71" stroke="#2b2117" stroke-width="3.5" stroke-linejoin="round">
    <circle cx="156" cy="70" r="8"/>
    <circle cx="142" cy="52" r="7"/>
    <circle cx="154" cy="34" r="7"/>
  </g>
</svg>
